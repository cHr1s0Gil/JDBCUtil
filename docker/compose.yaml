name: jdbcutil-databases

services:
  postgres:
    image: postgres:16-alpine
    container_name: jdbcutil-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgre}
      POSTGRES_USER: ${POSTGRES_USER:-postgre_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgre_user} -d ${POSTGRES_DB:-postgre}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: jdbcutil-oracle
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${ORACLE_APP_USER:-jdbcutil_user}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
    name: jdbcutil-postgres_postgres-data
  oracle-data:
    name: jdbcutil-oracle_oracle-data
    external: true

